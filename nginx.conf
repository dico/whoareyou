worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 128;
    gzip_vary on;
    gzip_proxied any;

    # Upload size limit
    client_max_body_size 1024M;

    server {
        listen 80;
        server_name _;

        # Signage display — separate entry point (no SPA router)
        location /signage/ {
            root /app/frontend;
            try_files $uri /signage.html;
        }

        # Frontend — static files. SPA fallback to /index.html for unknown
        # paths; no-cache applies because the catch-all returns HTML.
        location / {
            root /app/frontend;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # ES modules + HTML + manifest: always revalidate so iOS Safari PWA
        # can't pin old JS in cache after a deploy. Nginx serves ETag and
        # Last-Modified automatically — unchanged files return 304 (cheap).
        # CSS is included because the app reloads styles from disk too.
        location ~* \.(html|js|json|webmanifest|css)$ {
            root /app/frontend;
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        # Long-cache binary assets that don't change between deploys.
        location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ {
            root /app/frontend;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # API — proxy to Node.js
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Uploaded files — proxied through Node.js for auth
        location /uploads/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Internal location for X-Accel-Redirect (Nginx serves file after Node auth)
        location /internal-uploads/ {
            internal;
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "private, max-age=86400";
        }
    }
}
